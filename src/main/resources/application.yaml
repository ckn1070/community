server:
  port: 9097

spring:
  application:
    name: carmunity-api

  # 로컬 개발용 .env를 선택적으로 읽습니다. 운영 환경은 OS 환경변수 주입을 기본으로 봅니다.
  config:
    import: optional:file:.env[.properties]


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}

  # JPA와 Flyway가 함께 사용하는 데이터베이스 접속 정보입니다.
  datasource:
    # 로컬 기본값만 두고, 환경별 접속 정보는 DB_URL로 덮어씁니다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carmunity}
    # 계정과 비밀번호는 저장소에 남기지 않고 외부에서 주입합니다.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 스키마 변경은 Flyway가 담당하고, Hibernate는 검증만 수행합니다.
  jpa:
    hibernate:
      ddl-auto: validate

    # 지연로딩은 트랜잭션 안에서 처리하도록 OSIV를 끕니다.
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

    # 개발 중 쿼리 확인용입니다. 운영에서는 로그 레벨로 제어하는 편이 낫습니다.
    show-sql: true

  # DB 스키마 변경 이력은 src/main/resources/db/migration 아래 SQL로 관리합니다.
  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10485760B
      max-request-size: 11534336B
      file-size-threshold: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

carmunity:
  kafka:
    cleanup-enabled: ${KAFKA_CLEANUP_ENABLED:false}
    relay-enabled: ${KAFKA_RELAY_ENABLED:false}
    consumer-enabled: ${KAFKA_CONSUMER_ENABLED:false}
    sync-notifications-enabled: ${KAFKA_SYNC_NOTIFICATIONS_ENABLED:true}
    relay:
      properties:
        security.protocol: ${KAFKA_RELAY_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.truststore.type: ${KAFKA_TRUSTSTORE_TYPE:PEM}
        ssl.truststore.location: ${KAFKA_CA_PATH:}
        ssl.keystore.type: ${KAFKA_RELAY_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.location: ${KAFKA_RELAY_KEYSTORE_PATH:}
        ssl.keystore.password: ${KAFKA_RELAY_KEYSTORE_PASSWORD:}
        ssl.endpoint.identification.algorithm: https
    consumer:
      properties:
        security.protocol: ${KAFKA_CONSUMER_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.truststore.type: ${KAFKA_TRUSTSTORE_TYPE:PEM}
        ssl.truststore.location: ${KAFKA_CA_PATH:}
        ssl.keystore.type: ${KAFKA_CONSUMER_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.location: ${KAFKA_CONSUMER_KEYSTORE_PATH:}
        ssl.keystore.password: ${KAFKA_CONSUMER_KEYSTORE_PASSWORD:}
        ssl.endpoint.identification.algorithm: https
    dlt:
      properties:
        security.protocol: ${KAFKA_DLT_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.truststore.type: ${KAFKA_TRUSTSTORE_TYPE:PEM}
        ssl.truststore.location: ${KAFKA_CA_PATH:}
        ssl.keystore.type: ${KAFKA_DLT_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.location: ${KAFKA_DLT_KEYSTORE_PATH:}
        ssl.keystore.password: ${KAFKA_DLT_KEYSTORE_PASSWORD:}
        ssl.endpoint.identification.algorithm: https
    replay:
      properties:
        security.protocol: ${KAFKA_REPLAY_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.truststore.type: ${KAFKA_TRUSTSTORE_TYPE:PEM}
        ssl.truststore.location: ${KAFKA_CA_PATH:}
        ssl.keystore.type: ${KAFKA_REPLAY_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.location: ${KAFKA_REPLAY_KEYSTORE_PATH:}
        ssl.keystore.password: ${KAFKA_REPLAY_KEYSTORE_PASSWORD:}
        ssl.endpoint.identification.algorithm: https
  community:
    # 기반 배포와 사용자 공개 활성화를 분리합니다.
    enabled: ${COMMUNITY_ENABLED:false}
    cursor-hmac-secret: ${COMMUNITY_CURSOR_HMAC_SECRET:}
    trusted-proxy-cidrs: ${COMMUNITY_TRUSTED_PROXY_CIDRS:}
    media:
      bucket: ${COMMUNITY_MEDIA_BUCKET:}
      region: ${COMMUNITY_MEDIA_REGION:ap-northeast-2}
      role-arn: ${COMMUNITY_MEDIA_ROLE_ARN:}
      token-path: ${COMMUNITY_MEDIA_WEB_IDENTITY_TOKEN_PATH:/var/run/secrets/aws/serviceaccount/token}
  auth:
    jwt:
      issuer: ${AUTH_JWT_ISSUER:carmunity-api}
      access-token-ttl: ${AUTH_JWT_ACCESS_TOKEN_TTL:15m}
      # 운영 secret은 저장소에 두지 않고 환경변수나 secret manager로 주입합니다.
      hmac-secret: ${AUTH_JWT_HMAC_SECRET}
    login:
      identifier-hash:
        # 원문 email을 auth_event에 남기지 않기 위한 HMAC secret입니다. JWT secret과 분리합니다.
        hmac-secret: ${AUTH_LOGIN_IDENTIFIER_HMAC_SECRET}
  notification:
    email:
      resend:
        api-key: ${RESEND_API_KEY:}
      from: ${NOTIFICATION_EMAIL_FROM:}
      verification:
        base-url: ${EMAIL_VERIFICATION_BASE_URL:}
      admin-invitation:
        base-url: ${ADMIN_INVITATION_BASE_URL:}
      password-reset:
        base-url: ${PASSWORD_RESET_BASE_URL:}

logging:
  # 로컬 기본 콘솔 로그에서도 request id를 함께 보여서 API 오류와 운영 문의를 빠르게 상관분석합니다.
  pattern:
    level: "requestId:%X{requestId} %5p"
