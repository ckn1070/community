# 성공한 main CI revision 중 deploy 전용 변경을 제외하고 private ECR에 ARM64 image를 게시합니다.
name: Publish image
run-name: Publish image · ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

# 같은 revision의 재실행은 기존 immutable tag를 재사용하며 서로 취소하지 않습니다.
concurrency:
  group: publish-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify image publishing change
    # CI는 모든 source를 검증하고 push 전체의 분류를 남기며, 이 job은 그 exact run의 결과만 읽습니다.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.AWS_ECR_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.changed-paths.outputs.publish }}
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

    steps:
      - name: Checkout successful CI decision validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 고정
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download successful CI publishing decision
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 고정
        with:
          name: publish-image-change-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/publish-image-change
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate successful CI publishing decision
        id: changed-paths
        run: |
          set -euo pipefail
          decision_path="${RUNNER_TEMP}/publish-image-change/decision.env"
          ./scripts/quality/validate-image-publishing-decision.sh \
            "${IMAGE_TAG}" "${CI_RUN_ATTEMPT}" "${decision_path}" "${GITHUB_OUTPUT}"

  publish:
    name: Publish ARM64 image
    # PR·fork·실패한 CI·deploy 전용 변경에는 AWS identity를 발급하지 않습니다.
    needs: classify
    if: >-
      needs.classify.outputs.publish == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.AWS_ECR_PUBLISH_ENABLED == 'true'
    # Target과 같은 architecture에서 build해 QEMU instruction translation을 사용하지 않습니다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: car-community
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Validate publishing contract
        env:
          AWS_ECR_PUSH_ROLE_ARN: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${AWS_ECR_PUSH_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]

      - name: Checkout successful CI revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 고정
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure AWS credentials
        # 장기 access key 대신 exact repository·main branch로 제한한 GitHub OIDC role을 사용합니다.
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3 고정
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: car-community-${{ github.run_id }}

      - name: Log in to private ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6 고정

      - name: Reuse an existing immutable revision
        id: existing-image
        # 같은 SHA의 workflow 재실행은 immutable tag를 다시 push하지 않고 현재 digest를 확인합니다.
        run: |
          set -euo pipefail
          image_digest="$(aws ecr batch-get-image \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"
          if [[ "${image_digest}" == "None" ]]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "digest=" >> "${GITHUB_OUTPUT}"
          else
            [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "digest=${image_digest}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Docker Buildx
        if: steps.existing-image.outputs.exists == 'false'
        # Buildx는 native ARM64 BuildKit build·ECR 직접 push·digest 출력을 맡고 CPU emulation은 하지 않습니다.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0 고정

      - name: Read immutable image metadata
        if: steps.existing-image.outputs.exists == 'false'
        id: metadata
        run: |
          set -euo pipefail
          created="$(git show -s --format=%cI "${IMAGE_TAG}")"
          test -n "${created}"
          echo "created=${created}" >> "${GITHUB_OUTPUT}"

      - name: Build and push ARM64 image
        if: steps.existing-image.outputs.exists == 'false'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 고정
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          # Single-platform runtime manifest digest가 kubelet imageID와 직접 일치하도록 attestation wrapper index는 현재 만들지 않습니다.
          provenance: false
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          build-args: |
            REVISION=${{ env.IMAGE_TAG }}
            CREATED=${{ steps.metadata.outputs.created }}
            SOURCE_DIRTY=false

      - name: Record published image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_digest="${EXISTING_DIGEST:-${PUBLISHED_DIGEST}}"
          [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_reference="${ECR_REGISTRY}/${ECR_REPOSITORY}@${image_digest}"
          {
            echo "### Private ECR image"
            echo
            echo "- Revision tag: \`${IMAGE_TAG}\`"
            echo "- Deployment reference: \`${image_reference}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
