apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: car-community
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: car-community-gitops-bootstrap
spec:
  description: car-community staging GitOps deployment boundary
  sourceRepos:
    - https://github.com/example-org/car-community.git
  destinations:
    - namespace: car-community
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: kafka.strimzi.io
      kind: Kafka
    - group: kafka.strimzi.io
      kind: KafkaNodePool
    - group: kafka.strimzi.io
      kind: KafkaTopic
    - group: kafka.strimzi.io
      kind: KafkaUser
