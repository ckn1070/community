# dev-plan 스킬의 UI 표시와 기본 호출 문구를 정의합니다.
interface:
  display_name: "개발 계획"
  short_description: "계획 단계 작성·검증과 필수 local checkpoint 보존"
  default_prompt: "Use $dev-plan to freeze and close a plan-structure round before writing detailed content for any current-stage plan artifact handed to the user, then run one final content round without changing the closed skeleton. Keep recommendation, selection, confirmation, and mutation authority distinct, never reopen a closed decision as active, and collect answerable user-owned decisions into one block. Commit a validated stable repository plan checkpoint through exact-path $git-finalize before handoff; do not infer push authority."
