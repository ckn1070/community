# dev-plan 스킬의 UI 표시와 기본 호출 문구를 정의합니다.
interface:
  display_name: "개발 계획"
  short_description: "현재 계획 단계의 결정과 artifact만 근거 있게 작성"
  default_prompt: "Use $dev-plan to write only the current plan stage and its allowed artifacts, keep recommendation, selection, confirmation, and mutation authority distinct without forcing duplicate confirmation turns, collect answerable user-owned decisions into one block, pause on real ambiguity, and continue when an unambiguous final confirmation closes the stage."
