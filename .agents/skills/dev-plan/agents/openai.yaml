# dev-plan 스킬의 UI 표시와 기본 호출 문구를 정의합니다.
interface:
  display_name: "개발 계획"
  short_description: "계획 단계 작성·검증과 필수 local checkpoint 보존"
  default_prompt: "Use $dev-plan to write only the current plan stage and its allowed artifacts. When two or more outcome-changing candidates remain, compare only substitutable candidates that answer one question and share start/end conditions, apply the same outcome-changing axes, and state the criteria priority, accepted trade-off, and reopening condition. For an Agent-owned technical decision, record the final choice, decisive basis, and every rejected candidate's reason. For an open user decision, record the Agent recommendation, decisive basis, every non-recommended candidate's reason, pending-selection state, and one-shot response format without treating the recommendation as the user's choice. Treat an upstream-fixed value, a sole valid candidate remaining after source and mandatory criteria, and a value derived from a prior decision as three distinct non-comparison states; never invent alternatives for any of them. Keep recommendation, selection, confirmation, and mutation authority distinct without forcing duplicate confirmation turns, collect answerable user-owned decisions into one block, pause on real ambiguity, and continue when an unambiguous final confirmation closes the stage. When a validated stable repository plan checkpoint becomes recoverable, allow only its exact-path $git-finalize handoff until the local commit is verified; do not wait for the user, hand off to another phase, rewrite, report terminally, or infer push authority."
