apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-community-catalog-redis
  labels:
    app.kubernetes.io/name: car-community-catalog-redis
    app.kubernetes.io/component: catalog-cache
    app.kubernetes.io/part-of: car-community
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: car-community-catalog-redis
      app.kubernetes.io/component: catalog-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: car-community-catalog-redis
        app.kubernetes.io/component: catalog-cache
        app.kubernetes.io/part-of: car-community
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # Redis Open Source 8.2 extended line의 8.2.9 ARM64 manifest를 고정합니다.
          image: redis:8.2.9-alpine3.22@sha256:77dcf738f8eba3ca2c7a26a5a1756e1259a7eca7451234f766eca3bc4a46790e
          imagePullPolicy: IfNotPresent
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 384mb
            - --maxmemory-policy
            - allkeys-lfu
            - --aclfile
            - /etc/redis-acl/users.acl
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PROBE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: car-community-catalog-redis-server
                  key: REDIS_PROBE_USERNAME
            - name: REDIS_PROBE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: car-community-catalog-redis-server
                  key: REDIS_PROBE_PASSWORD
          startupProbe: &redisProbe
            exec:
              command:
                - sh
                - -ec
                - >-
                  response="$(REDISCLI_AUTH="$REDIS_PROBE_PASSWORD" redis-cli --user
                  "$REDIS_PROBE_USERNAME" --no-auth-warning PING)" && [ "$response" = PONG ]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            <<: *redisProbe
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            <<: *redisProbe
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: redis-acl
              mountPath: /etc/redis-acl
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: redis-acl
          secret:
            secretName: car-community-catalog-redis-server
            items:
              - key: users.acl
                path: users.acl
