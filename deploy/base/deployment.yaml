apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-community
  labels:
    app.kubernetes.io/name: car-community
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: car-community
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: car-community
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: car-community
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: car-community
    spec:
      serviceAccountName: car-community-application
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          # staging overlay가 실제 ECR digest로 교체하지 않으면 pull할 수 없는 base 기본값입니다.
          image: registry.invalid/car-community
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9097
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: car-community-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: car-community-db-runtime
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: car-community-db-runtime
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: car-community-catalog-redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: car-community-catalog-redis-application
                  key: REDIS_USERNAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: car-community-catalog-redis-application
                  key: REDIS_PASSWORD
            - name: CATALOG_MODEL_DETAIL_CACHE_ENABLED
              value: "false"
            - name: AUTH_JWT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: car-community-auth
                  key: AUTH_JWT_HMAC_SECRET
            - name: AUTH_LOGIN_IDENTIFIER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: car-community-auth
                  key: AUTH_LOGIN_IDENTIFIER_HMAC_SECRET
            - name: COMMUNITY_ENABLED
              value: "false"
            - name: COMMUNITY_CURSOR_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: car-community-community
                  key: COMMUNITY_CURSOR_HMAC_SECRET
                  optional: true
            - name: COMMUNITY_MEDIA_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: car-community-community-config
                  key: COMMUNITY_MEDIA_BUCKET
                  optional: true
            - name: COMMUNITY_MEDIA_REGION
              valueFrom:
                configMapKeyRef:
                  name: car-community-community-config
                  key: COMMUNITY_MEDIA_REGION
                  optional: true
            - name: COMMUNITY_MEDIA_ROLE_ARN
              valueFrom:
                configMapKeyRef:
                  name: car-community-community-config
                  key: COMMUNITY_MEDIA_ROLE_ARN
                  optional: true
            - name: COMMUNITY_TRUSTED_PROXY_CIDRS
              valueFrom:
                configMapKeyRef:
                  name: car-community-community-config
                  key: COMMUNITY_TRUSTED_PROXY_CIDRS
                  optional: true
          envFrom:
            - configMapRef:
                name: car-community-notification-config
            - secretRef:
                name: car-community-notification
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rds-ca
              mountPath: /etc/car-community/rds-ca
              readOnly: true
            - name: aws-web-identity-token
              mountPath: /var/run/secrets/aws/serviceaccount
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rds-ca
          configMap:
            name: car-community-rds-ca
            items:
              - key: ap-northeast-2-bundle.pem
                path: ap-northeast-2-bundle.pem
        - name: aws-web-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
