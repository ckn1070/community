apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: car-community

resources:
  - ../../base
  - ingress.yaml
  - pre-sync

patches:
  - path: service-nodeport-patch.yaml
  - path: deployment-profile-patch.yaml

configMapGenerator:
  - name: car-community-community-config
    literals:
      - COMMUNITY_MEDIA_BUCKET=car-community-stg-media-000000000000-ap-northeast-2
      - COMMUNITY_MEDIA_REGION=ap-northeast-2
      - COMMUNITY_MEDIA_ROLE_ARN=arn:aws:iam::000000000000:role/car-community-stg-media-role
      - COMMUNITY_TRUSTED_PROXY_CIDRS=10.0.0.0/20,10.0.16.0/20
  - name: car-community-notification-config
    literals:
      # 승인된 staging sender와 공개 URL을 application notification 설정으로 제공합니다.
      - NOTIFICATION_EMAIL_FROM=no-reply@example.com
      - EMAIL_VERIFICATION_BASE_URL=https://example.com
      - ADMIN_INVITATION_BASE_URL=https://example.com
      - PASSWORD_RESET_BASE_URL=https://example.com

images:
  - name: registry.invalid/car-community
    newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/car-community
    # main 0df1aef7에서 게시된 ARM64 runtime manifest입니다.
    digest: sha256:8e94a6bd13dd31a13b3c692590700cfac23266297e260dae6c2584f0cc998613
