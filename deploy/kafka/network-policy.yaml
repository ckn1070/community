apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: kafka-client-ingress}
spec:
  podSelector:
    matchLabels: {strimzi.io/cluster: car-community}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: car-community}
      ports:
        - {port: 9093, protocol: TCP}
