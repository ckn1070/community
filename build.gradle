// Spring Boot application의 dependency, Java 21 toolchain, test·coverage·format·Sonar 검증 계약을 한곳에서 관리합니다.
plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.6.0'
	id 'org.sonarqube' version '7.2.3.7755'
	id 'org.jooq.jooq-codegen-gradle' version '3.19.32'
}

group = 'com.ronams'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.modulith:spring-modulith-bom:2.1.0'
	}
}

def sonarProjectKey = providers.gradleProperty('sonar.projectKey')
		.orElse(providers.environmentVariable('SONAR_PROJECT_KEY'))
		.orElse(rootProject.name)
def sonarOrganization = providers.gradleProperty('sonar.organization')
		.orElse(providers.environmentVariable('SONAR_ORGANIZATION'))
def sonarHostUrl = providers.gradleProperty('sonar.host.url')
		.orElse(providers.environmentVariable('SONAR_HOST_URL'))
		.orElse('https://sonarcloud.io')
def jacocoXmlReportPath = 'build/reports/jacoco/test/jacocoTestReport.xml'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'com.resend:resend-java:v4.15.0'
	implementation platform('software.amazon.awssdk:bom:2.39.1')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:sts'
	implementation 'org.springframework.modulith:spring-modulith-api'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
	implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	jooqCodegen 'org.jooq:jooq-meta-extensions:3.19.32'
}

jooq {
	configuration {
		generator {
			database {
				name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
				properties {
					property {
						key = 'scripts'
						value = 'src/main/resources/db/migration/V1[5-9]__*.sql'
					}
					property {
						key = 'sort'
						value = 'flyway'
					}
					property {
						key = 'defaultNameCase'
						value = 'lower'
					}
				}
			}
			target {
				packageName = 'com.ronams.carmunity.catalog.internal.adapter.out.persistence.jooq.generated'
				directory = 'build/generated-sources/jooq'
			}
		}
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('jooqCodegen')
}

tasks.named('test') {
	useJUnitPlatform()
}

jacoco {
	toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestReport')
}

spotless {
	java {
		target 'src/*/java/**/*.java'
		googleJavaFormat('1.28.0')
	}
}

sonar {
	properties {
		property 'sonar.projectKey', sonarProjectKey.get()
		property 'sonar.host.url', sonarHostUrl.get()
		if (sonarOrganization.isPresent()) {
			property 'sonar.organization', sonarOrganization.get()
		}
		property 'sonar.sources', 'src/main/java,src/main/resources/application.yaml'
		property 'sonar.tests', 'src/test/java'
		property 'sonar.exclusions', 'docs/**,*.md,**/*.md,.idea/**,build/**,.gradle/**'
		// 제품의 10 MiB 계약은 disk-backed multipart와 application size 검증으로 제한하므로 generic 8 MiB 규칙만 이 설정 file에서 제외합니다.
		property 'sonar.issue.ignore.multicriteria', 'multipartUploadLimit'
		property 'sonar.issue.ignore.multicriteria.multipartUploadLimit.ruleKey', 'java:S5693'
		property 'sonar.issue.ignore.multicriteria.multipartUploadLimit.resourceKey', 'src/main/resources/application.yaml'
		property 'sonar.coverage.jacoco.xmlReportPaths', jacocoXmlReportPath
		property 'sonar.qualitygate.wait', 'true'
		property 'sonar.qualitygate.timeout', '300'
	}
}

tasks.named('sonar') {
	dependsOn tasks.named('check')
	dependsOn tasks.named('jacocoTestReport')
}
