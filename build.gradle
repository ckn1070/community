// Spring Boot application의 dependency, Java 21 toolchain, test·coverage·format·Sonar 검증 계약을 한곳에서 관리합니다.
plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.1'
	id 'org.sonarqube' version '7.4.0.8496'
}

group = 'com.ronams'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.modulith:spring-modulith-bom:2.1.1'
	}
}

def sonarProjectKey = providers.gradleProperty('sonar.projectKey')
		.orElse(providers.environmentVariable('SONAR_PROJECT_KEY'))
		.orElse(rootProject.name)
def sonarOrganization = providers.gradleProperty('sonar.organization')
		.orElse(providers.environmentVariable('SONAR_ORGANIZATION'))
def sonarHostUrl = providers.gradleProperty('sonar.host.url')
		.orElse(providers.environmentVariable('SONAR_HOST_URL'))
		.orElse('https://sonarcloud.io')
def jacocoXmlReportPath = 'build/reports/jacoco/test/jacocoTestReport.xml'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'com.resend:resend-java:v4.18.0'
	implementation 'org.springframework.modulith:spring-modulith-api'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

jacoco {
	toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestReport')
}

spotless {
	java {
		target 'src/*/java/**/*.java'
		googleJavaFormat('1.28.0')
	}
}

sonar {
	properties {
		property 'sonar.projectKey', sonarProjectKey.get()
		property 'sonar.host.url', sonarHostUrl.get()
		if (sonarOrganization.isPresent()) {
			property 'sonar.organization', sonarOrganization.get()
		}
		property 'sonar.sources', 'src/main/java,src/main/resources/application.yaml'
		property 'sonar.tests', 'src/test/java'
		property 'sonar.exclusions', 'docs/**,*.md,**/*.md,.idea/**,build/**,.gradle/**'
		property 'sonar.coverage.jacoco.xmlReportPaths', jacocoXmlReportPath
		property 'sonar.qualitygate.wait', 'true'
		property 'sonar.qualitygate.timeout', '300'
	}
}

tasks.named('sonar') {
	dependsOn tasks.named('check')
	dependsOn tasks.named('jacocoTestReport')
}
